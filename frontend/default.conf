
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    access_log off;
    location ~ ^/assets/.+\.mjs$ {
        default_type application/javascript;
        expires 1y;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
