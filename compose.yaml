
name: documind-ai

x-api: &api
  image: documind-ai-api:local
  build:
    context: ./backend
    target: runtime
  env_file: .env
  volumes:
    - model-cache:/model-cache
  networks: [private, egress]
  init: true

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-documind}
      POSTGRES_USER: ${DATABASE_USER:-documind}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run the environment setup script}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes: [redis:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: documind-ai-minio:local
    build: ./infra/minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run the environment setup script}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run the environment setup script}
    volumes: [minio:/data]
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    <<: *api
    command: ["python", "-m", "app.storage"]
    depends_on:
      minio: {condition: service_healthy}

  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    <<: *api
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  celery-worker:
    <<: *api
    command: ["celery", "-A", "app.worker", "worker", "--pool=solo", "--beat", "--schedule=/tmp/documind-beat", "--loglevel=WARNING"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    image: documind-ai-web:local
    build: ./frontend
    networks: [private]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 4s
      retries: 8

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports: ["127.0.0.1:${APP_PORT:-8080}:8080"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [private, egress]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/api/v1/ready"]
      interval: 10s
      timeout: 5s
      retries: 8

  ollama:
    image: ollama/ollama:0.18.2
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]
    networks: [egress]
    restart: unless-stopped

networks:
  private:
    internal: true
  egress:

volumes:
  postgres:
  redis:
  minio:
  model-cache:
  ollama:
