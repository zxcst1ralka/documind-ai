
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
cache_dir = "/tmp/documind-pytest-cache"
markers = ["integration: requires the isolated Compose test stack", "live_ai: opt-in real model smoke test"]
